services:
  - type: web
    name: autoworth-ai-ml-service
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r ml/requirements.txt"
    startCommand: "uvicorn ml.api:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000,http://localhost:5173,https://used-car-seven.vercel.app,https://autoworth-ai.vercel.app"
